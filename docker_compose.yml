services:
  postgis:
    build:
      context: .
      dockerfile: docker/postgis/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-psip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-psip}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Ustaw POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  python:
    profiles: ["tools"]
    image: psip-h3-tools:lab2
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    environment:
      PGHOST: postgis
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-psip}
      PGDATABASE: ${POSTGRES_DB:-psip}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD}
    command: ["python", "/app/python/load.py"]
    depends_on:
      postgis:
        condition: service_healthy

volumes:
  pgdata:
